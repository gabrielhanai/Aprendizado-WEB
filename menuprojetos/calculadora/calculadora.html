<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="calculadora.css">
</head>
<body>
    <a href="../../menu/menu.html"><button id="voltar">Voltar</button></a>
    <button id="mudartema" onclick="mudarTema()">Mudar tema</button>
    <div id="calculadora">
        <div id="display">
            0
        </div>
        <div id="botoes">
            <button class="botao" onclick="addvalor(7)">7</button>
            <button class="botao" onclick="addvalor(8)">8</button>
            <button class="botao" onclick="addvalor(9)">9</button> <br>
            <button class="botao" onclick="addvalor(4)">4</button> 
            <button class="botao" onclick="addvalor(5)">5</button> 
            <button class="botao" onclick="addvalor(6)">6</button> <br>
            <button class="botao" onclick="addvalor(3)">3</button> 
            <button class="botao" onclick="addvalor(2)">2</button>
            <button class="botao" onclick="addvalor(1)">1</button> <br>
            <button class="botao" onclick="addvalor(0)">0</button>
            <button class="botao" onclick="addvalor('/')">/</button> 
            <button class="botao" onclick="addvalor('*')">*</button> <br>
            <button class="botao" onclick="addvalor('+')">+</button> 
            <button class="botao" onclick="addvalor('-')">-</button>
            <button class="botao" onclick="limpar()">C</button> <br>
            <button class="botao" onclick="igual()">=</button>
            <button class="botao" onclick="addvalor('.')">.</button>
            <button class="botao" onclick="addvalor('**')">^</button>
        </div>
    </div>
    <script src="calculadora.js"></script>
</body>
</html>
